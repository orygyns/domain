  <style>
    /* --- CSS Variables for Theming --- */
    :root[data-theme="dark"] {
      --bg-color: #121619;
      --surface: #1e2429;
      --surface-hover: #262c33;
      --text-main: #f5f6fa;
      --text-muted: #a4b0be;
      --primary-green: #16a34a;
      --primary-dark: #15803d;
      --nav-bg: rgba(18, 22, 25, 0.95);
      --card-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      --border-color: #2f363d;
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --bar-bg: #2a3138;
      --toggler-icon: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 30'%3e%3cpath stroke='rgba%28245, 246, 250, 1%29' stroke-linecap='round' stroke-miterlimit='10' stroke-width='2' d='M4 7h22M4 15h22M4 23h22'/%3e%3c/svg%3e");
    }

    :root[data-theme="light"] {
      --bg-color: #f8f9fa;
      --surface: #ffffff;
      --surface-hover: #f1f3f5;
      --text-main: #2d3436;
      --text-muted: #636e72;
      --primary-green: #16a34a;
      --primary-dark: #15803d;
      --nav-bg: rgba(255, 255, 255, 0.95);
      --card-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      --border-color: #e1e4e8;
      --danger: #dc2626;
      --danger-hover: #b91c1c;
      --bar-bg: #e9ecef;
      --toggler-icon: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 30'%3e%3cpath stroke='rgba%2845, 52, 54, 1%29' stroke-linecap='round' stroke-miterlimit='10' stroke-width='2' d='M4 7h22M4 15h22M4 23h22'/%3e%3c/svg%3e");
    }

    /* --- Global Styles --- */
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); line-height: 1.6; transition: background-color 0.3s, color 0.3s; display: flex; flex-direction: column; min-height: 100vh; padding-top: 80px; }
    a { text-decoration: none; color: inherit; }

    /* --- Navbar overrides --- */
    .navbar { background-color: var(--nav-bg); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border-color); padding: 1rem 0; transition: background-color 0.3s, border-color 0.3s; }
    .logo { font-size: 1.8rem; font-weight: 800; color: var(--primary-green) !important; letter-spacing: 1px; }
    .navbar-nav .nav-link { font-weight: 600; color: var(--text-main) !important; transition: color 0.2s; padding: 0.5rem 1.2rem; }
    .navbar-nav .nav-link:hover { color: var(--primary-green) !important; }
    .navbar-toggler { border-color: var(--border-color); }
    .navbar-toggler-icon { background-image: var(--toggler-icon); }

    .theme-toggle { background: var(--surface); border: 2px solid var(--border-color); color: var(--text-main); font-size: 1.2rem; cursor: pointer; padding: 0.4rem 0.8rem; border-radius: 8px; transition: all 0.2s ease; display: inline-flex; align-items: center; justify-content: center; height: 42px; }
    .theme-toggle:hover { border-color: var(--primary-green); }

    /* --- Main Dashboard Area --- */
    main { flex: 1; padding: 40px 0 60px; width: 100%; max-width: 1100px; margin: 0 auto; }
    
    .dashboard-header { margin-bottom: 3rem; animation: fadeInUp 0.5s ease; text-align: center; }
    #greeting-text { font-size: 1.6rem; color: var(--text-muted); margin-bottom: 0.5rem; font-weight: 600; }
    #greeting-name { color: var(--primary-green); }
    .dashboard-title { font-size: 2.8rem; color: var(--text-main); margin-bottom: 2rem; font-weight: 800; }

    /* --- Overall Stats Summary --- */
    .stat-box { background-color: var(--surface); padding: 2rem 1.5rem; border-radius: 16px; border: 1px solid var(--border-color); box-shadow: var(--card-shadow); text-align: center; height: 100%; transition: transform 0.3s ease; }
    .stat-box:hover { transform: translateY(-4px); }
    .stat-box h3 { font-size: 1.2rem; color: var(--text-muted); margin-bottom: 0.5rem; font-weight: 600; }
    .stat-value { font-size: 3rem; font-weight: 800; color: var(--primary-green); }

    /* --- Course Cards Grid --- */
    .course-card { background-color: var(--surface); padding: 2rem; border-radius: 16px; border: 1px solid var(--border-color); box-shadow: var(--card-shadow); display: flex; flex-direction: column; transition: transform 0.3s ease, border-color 0.3s ease; animation: fadeInUp 0.7s ease; }
    .course-card:hover { transform: translateY(-6px); border-color: var(--primary-green); }
    
    .card-header-flex { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1rem; flex-wrap: wrap; gap: 10px; }
    .card-title-text { font-size: 1.4rem; font-weight: bold; color: var(--text-main); margin: 0; }
    .status-text { font-size: 1.1rem; font-weight: 600; }
    .text-green { color: var(--primary-green); }
    .text-muted-custom { color: var(--text-muted); }

    .encouragement { font-size: 1rem; font-style: italic; color: var(--text-muted); margin-bottom: 1.5rem; min-height: 24px; }

    /* --- Progress Bar --- */
    .progress-track { width: 100%; height: 12px; background-color: var(--bar-bg); border-radius: 10px; overflow: hidden; margin-bottom: 1.5rem; position: relative; }
    .progress-fill { height: 100%; background-color: var(--primary-green); width: 0%; transition: width 1s cubic-bezier(0.4, 0, 0.2, 1); border-radius: 10px; }

    /* --- Card Actions --- */
    .card-actions { margin-top: auto; display: flex; justify-content: space-between; align-items: center; }
    
    .btn-action { padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; text-align: center; border: none; font-size: 1rem; transition: all 0.2s ease; text-decoration: none; display: inline-block; }
    
    .btn-start { background-color: var(--primary-green); color: #fff !important; width: 100%; }
    .btn-start:hover { background-color: var(--primary-dark); transform: translateY(-2px); }
    
    .btn-reset { background-color: transparent; border: 1px solid var(--danger); color: var(--danger); padding: 8px 16px; width: 100%; }
    .btn-reset:hover { background-color: var(--danger); color: #fff; transform: translateY(-2px); }

    /* --- Footer --- */
    footer { text-align: center; padding: 4rem 2rem 2rem; background-color: var(--surface); border-top: 1px solid var(--border-color); margin-top: auto; }
    .footer-nav { display: flex; justify-content: center; flex-wrap: wrap; gap: 2rem; margin-bottom: 2rem; }
    .footer-nav a { color: var(--text-main); font-weight: 600; transition: color 0.2s ease; }
    .footer-nav a:hover { color: var(--primary-green); }
    footer p { margin: 0; color: var(--text-muted); font-size: 0.95rem; }

    /* --- Animations --- */
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

    @media (max-width: 768px) { 
      .dashboard-title { font-size: 2.2rem; } 
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>

  <script>
    // --- Theme Logic ---
    const themeToggleBtn = document.getElementById('theme-toggle');
    const htmlElement = document.documentElement;

    function updateIcon(theme) {
      themeToggleBtn.textContent = theme === 'dark' ? '☀️' : '🌙';
    }
    updateIcon(htmlElement.getAttribute('data-theme'));

    themeToggleBtn.addEventListener('click', () => {
      const currentTheme = htmlElement.getAttribute('data-theme');
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      htmlElement.setAttribute('data-theme', newTheme);
      localStorage.setItem('orygyns_theme', newTheme);
      updateIcon(newTheme);
    });

    // --- Personalization Logic ---
    const userName = localStorage.getItem('userName');
    const greetingText = document.getElementById('greeting-text');
    if (userName && userName.trim() !== '') {
      greetingText.innerHTML = `Hi <span id="greeting-name">${userName}</span> 👋`;
    }

    // --- Course Data Configuration ---
    const subjects = [
      { id: 'c', name: 'C Programming', storageKey: 'cQuiz', link: 'c.html' },
      { id: 'cpp', name: 'C++', storageKey: 'cppQuiz', link: 'cpp.html' },
      { id: 'python', name: 'Python', storageKey: 'pythonQuiz', link: 'python.html' },
      { id: 'java', name: 'Java', storageKey: 'javaQuiz', link: 'java.html' },
      { id: 'tools', name: 'Developer Tools', storageKey: 'toolsQuiz', link: 'tools.html' }
    ];

    // --- Render Logic ---
    const container = document.getElementById('cards-container');
    const statStarted = document.getElementById('stat-started');
    const statAverage = document.getElementById('stat-average');

    function renderDashboard() {
      container.innerHTML = '';
      let startedCount = 0;
      let totalPercentAccumulated = 0;

      subjects.forEach(subject => {
        const rawData = localStorage.getItem(subject.storageKey);
        let htmlString = '';

        if (rawData) {
          // Subject Attempted
          startedCount++;
          const data = JSON.parse(rawData);
          
          // Calculate percentage safely
          let percent = 0;
          if (data.percent !== undefined) {
              percent = data.percent;
          } else if (data.total > 0) {
              percent = Math.round((data.score / data.total) * 100);
          }
          
          // STRICT RULE: Never show 0% if attempted. Minimum visible is 1%.
          let displayPercent = percent <= 0 ? 1 : percent;
          totalPercentAccumulated += displayPercent;

          // Encouragement Logic
          let msg = "💪 Keep going!";
          if (displayPercent >= 80) msg = "🔥 Excellent!";
          else if (displayPercent >= 50) msg = "👍 Good progress!";

          htmlString = `
            <div class="col-12 col-md-6 col-lg-4 d-flex">
              <div class="course-card w-100">
                <div class="card-header-flex">
                  <h3 class="card-title-text">${subject.name}</h3>
                  <span class="status-text text-green">${displayPercent}% Completed</span>
                </div>
                <div class="encouragement">${msg}</div>
                
                <div class="progress-track" role="progressbar" aria-valuenow="${displayPercent}" aria-valuemin="0" aria-valuemax="100">
                  <div class="progress-fill" style="width: ${displayPercent}%;"></div>
                </div>
                
                <div class="card-actions">
                  <button class="btn-action btn-reset" onclick="resetSubject('${subject.storageKey}')" aria-label="Reset progress for ${subject.name}">Reset Progress</button>
                </div>
              </div>
            </div>
          `;
        } else {
          // Subject Not Attempted
          htmlString = `
            <div class="col-12 col-md-6 col-lg-4 d-flex">
              <div class="course-card w-100" style="border-style: dashed; border-color: var(--border-color);">
                <div class="card-header-flex">
                  <h3 class="card-title-text">${subject.name}</h3>
                  <span class="status-text text-muted-custom">Not Started</span>
                </div>
                <div class="encouragement">Ready to begin?</div>
                
                <div class="progress-track" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">
                  <div class="progress-fill" style="width: 0%;"></div>
                </div>
                
                <div class="card-actions" style="justify-content: center;">
                  <a href="${subject.link}" class="btn-action btn-start" aria-label="Start learning ${subject.name}">Start now 🚀</a>
                </div>
              </div>
            </div>
          `;
        }

        container.innerHTML += htmlString;
      });

      // Update Overall Stats
      statStarted.innerText = `${startedCount}/${subjects.length}`;
      if (startedCount > 0) {
        const avg = Math.round(totalPercentAccumulated / startedCount);
        statAverage.innerText = `${avg}%`;
      } else {
        statAverage.innerText = `0%`; // It's okay to show 0% on the average if literally nothing is started
      }
    }

    // --- Reset Function ---
    window.resetSubject = function(storageKey) {
      if (confirm('Are you sure you want to reset your progress for this topic?')) {
        localStorage.removeItem(storageKey);
        renderDashboard(); // Re-render instantly
      }
    };

    // Initialize Dashboard
    // Use a small timeout to allow CSS transitions for progress bars to trigger smoothly on load
    setTimeout(renderDashboard, 100);

  </script>
